services:
  torrent-intake:
    image: ghcr.io/${GITHUB_OWNER:-outlain}/torrent-intake:${IMAGE_TAG:-latest}
    container_name: torrent-intake
    user: "${INTAKE_UID:-10001}:${INTAKE_GID:-10001}"
    init: true
    restart: unless-stopped
    read_only: true
    stop_grace_period: 60s
    # No application environment overrides are required for the standard mounts.
    # Settings/secrets live in /app/data/settings.json (including after restore).
    # Gear > unlock > edit > review > pause/save > restart here > verify/resume.
    # Any explicit TI_* override locks that field in the UI until removed/redeployed.
    # Optional explicit overrides still work and are persisted at startup:
    # environment:
    #   TI_QBT_HOST: ${TI_QBT_HOST}
    #   TI_INFECTED_ACTION: ${TI_INFECTED_ACTION}
    volumes:
      - ${TI_DATA_HOST_DIR:-/opt/docker/torrent-intake/data}:/app/data:rw
      - ${TI_LOCAL_STAGING_HOST_DIR:-/mnt/bulk/docker/torrent-intake/staging}:/staging-local:rw
      - ${TI_MEDIA_HOST_DIR:-/mnt/media}:/downloads:rw
      - ${TI_EVENTS_HOST_DIR:-/opt/docker/clamav-shared/events/torrent-intake}:/events:rw
      - ${TI_QUARANTINE_HOST_DIR:-/opt/docker/clamav-shared/quarantine/torrent-intake}:/quarantine:rw
      - ${TI_CLAMD_SOCKET_HOST_DIR:-/opt/docker/clamav-shared/sockets/torrent-intake}:/run/clamav:rw
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=256m,mode=1777
    ports:
      # Job UI/API is private-network only; new admin controls require a local token.
      - "${TI_UI_PUBLISH_IP:-127.0.0.1}:${TI_UI_HOST_PORT:-8095}:8000"
    networks:
      - shared_media_net
    depends_on:
      torrent-intake-clamd:
        condition: service_healthy
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 2g
    cpus: 2.0
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  torrent-intake-clamd:
    image: ghcr.io/${GITHUB_OWNER:-outlain}/torrent-intake-clamd:${IMAGE_TAG:-latest}
    container_name: torrent-intake-clamd
    user: "${INTAKE_UID:-10001}:${INTAKE_GID:-10001}"
    init: true
    restart: unless-stopped
    read_only: true
    network_mode: none
    environment:
      DEFINITIONS_WAIT_TIMEOUT: "1800"
      DEFINITIONS_MAX_AGE_SECONDS: ${DEFINITIONS_MAX_AGE_SECONDS:-172800}
      CLAMD_MAX_SCAN_SIZE_MIB: ${CLAMD_MAX_SCAN_SIZE_MIB:-2000}
    # The image fixes DatabaseDirectory=/var/lib/clamav and
    # LocalSocket=/run/clamav/clamd.sock; their health-check defaults match.
    volumes:
      - ${CLAMAV_DEFS_HOST_DIR:-/opt/docker/clamav-shared/defs}:/var/lib/clamav:ro
      - ${TI_CLAMD_SOCKET_HOST_DIR:-/opt/docker/clamav-shared/sockets/torrent-intake}:/run/clamav:rw
    tmpfs:
      # ClamD stages each INSTREAM request here. Four 512 MiB parallel
      # windows need 2 GiB before ClamAV's own temporary working space.
      - /tmp:rw,nosuid,nodev,noexec,size=4g,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 8g
    cpus: 4.0
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  shared_media_net:
    name: ${MEDIA_NETWORK:-shared_media_net}
    external: true
