name: Validate and publish Docker images

on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check Python syntax
        run: python3 -m py_compile app/*.py clamav/*.py

      - name: Validate Compose examples
        env:
          TI_QBT_PASSWORD: test-password
          TI_COMPLETION_EVENT_TOKEN: test-token
        run: |
          docker compose -f docker-compose.example.yml config --quiet
          docker compose -f portainer-stack.example.yml config --quiet

      - name: Build application image
        run: docker build --tag torrent-intake:test .

      - name: Run application tests in the built image
        run: docker run --rm --mount type=bind,src="${GITHUB_WORKSPACE}",dst=/workspace,readonly --entrypoint python torrent-intake:test -m unittest discover -s /workspace/tests -v

      - name: Verify application hardening compatibility
        run: |
          docker run --rm --entrypoint id torrent-intake:test -u | grep -qx 10001
          docker run --rm --read-only --tmpfs /tmp:rw,nosuid,nodev,noexec,size=64m --entrypoint python torrent-intake:test -c 'import app.scanner, app.paths, app.torrent_guard'

      - name: Build ClamD image
        run: docker build --file Dockerfile.clamd --tag torrent-intake-clamd:test .

      - name: Verify ClamD image
        run: |
          docker run --rm --entrypoint clamd torrent-intake-clamd:test --version | grep -E '^ClamAV 1\.4\.5($|/)'
          docker run --rm --entrypoint id torrent-intake-clamd:test -u | grep -qx 10001

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Validate arm64 builds
        run: |
          docker buildx build --platform linux/arm64 --load --tag torrent-intake:test-arm64 .
          docker buildx build --platform linux/arm64 --load --file Dockerfile.clamd --tag torrent-intake-clamd:test-arm64 .
          docker run --rm --mount type=bind,src="${GITHUB_WORKSPACE}",dst=/workspace,readonly --entrypoint python torrent-intake:test-arm64 -m unittest discover -s /workspace/tests -v

  publish:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: torrent-intake
            dockerfile: Dockerfile
          - image: torrent-intake-clamd
            dockerfile: Dockerfile.clamd
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short
      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
