DatabaseDirectory /var/lib/clamav

# The app and daemon share this socket through a Docker volume. TCP is bound
# only to loopback so the image's internal health check can still ping clamd.
LocalSocket /tmp/clamd.sock
LocalSocketMode 666
FixStaleSocket yes
TCPSocket 3310
TCPAddr 127.0.0.1
EnableShutdownCommand no

User clamav
Foreground yes
ExitOnOOM yes
SelfCheck 600
ConcurrentDatabaseReload yes

# Match Torrent Intake's maximum of 2000 MiB. ClamAV has a hard design limit
# near 2 GiB; larger individual files are rejected by the app before scanning.
MaxFileSize 2000M
MaxScanSize 2000M
MaxScanTime 3600000
MaxFiles 100000
AlertExceedsMax yes

MaxThreads 4
MaxQueue 16
MaxConnectionQueueLength 16
ReadTimeout 300
CommandReadTimeout 30
SendBufTimeout 500
IdleTimeout 60
